<!doctype html>
<html lang="ru"><head><script>if (/shim/.test(location.search)) window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16);</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<base href="../">
<title>Главная PongHub — варианты</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
/* Демо: варианты главной с ракеткой и 3D-игроком. Верх главной — настоящая вёрстка приложения, данные — пример. */
body { background: var(--bg); margin: 0; }
.dm-wrap { max-width: 480px; margin: 0 auto; padding: 12px 16px 120px; }
.dm-tabs { position: sticky; top: 0; z-index: 20; display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line, #e3e8f0); }
.dm-tabs button { flex: none; border: 0; border-radius: 999px; padding: 9px 14px; background: var(--bg2); color: var(--text); font: 700 14px Inter, sans-serif; cursor: pointer; }
.dm-tabs button.on { background: #e63946; color: #fff; }
.dm-note { margin: 4px 0 14px; padding: 12px 14px; border-radius: 14px; background: #fff7d6; color: #4a3a00; font: 500 14px/1.4 Inter, sans-serif; }
.dm-note b { display: block; font-size: 16px; margin-bottom: 2px; }
.dm-ghost { opacity: .45; pointer-events: none; }
/* вариант 1: ракетка вместо «места» в шапке */
.v1-top { display: grid; grid-template-columns: 1fr 150px; gap: 8px; align-items: center; }
.v1-rk { position: relative; height: 200px; margin: -6px -6px -6px 0; cursor: grab; touch-action: none; }
.v1-rk canvas, .v-stage canvas { width: 100% !important; height: 100% !important; display: block; }
.v1-place { display: inline-flex; gap: 6px; align-items: baseline; margin-top: 8px; padding: 4px 10px; border-radius: 999px; background: linear-gradient(135deg, var(--wood-l), var(--wood)); color: #3b2410; font: 800 15px var(--display); }
.v1-place small { font: 600 11px Inter, sans-serif; opacity: .8; }
.v-cap { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font: 600 11px Inter, sans-serif; color: rgba(255,255,255,.8); pointer-events: none; }
/* ваш вариант: ракетка в белой рамке в шапке + «Мой игрок» на полширины */
.my-top { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: 12px; align-items: center; }
.my-frame { position: relative; height: 168px; border-radius: 18px; border: 3px solid rgba(255,255,255,.95); background: #fff; box-shadow: 0 6px 18px rgba(5,20,60,.35), inset 0 0 0 1px rgba(255,255,255,.25); overflow: hidden; cursor: grab; touch-action: none; }
.my-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
.my-card { display: flex; flex-direction: column; border-radius: 22px; padding: 10px; color: #fff; text-decoration: none; background: linear-gradient(160deg, #2f74d6, #1f5fc4 45%, #154a9e); box-shadow: 0 8px 22px rgba(14,59,140,.3); }
.my-card h4 { margin: 2px 4px 8px; font: 800 18px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.my-card .my-frame { height: 170px; border-radius: 16px; background: #fff; }
.my-frame canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
.my-side { justify-content: space-between; background: linear-gradient(160deg, #ffffff, #eef3fb); color: var(--text); }
.my-side b { font: 800 30px var(--display); color: #e63946; } .my-side small { color: var(--muted); font: 600 12px Inter, sans-serif; }
/* витрины 2–4 */
.v-show { position: relative; margin-top: 12px; border-radius: 22px; overflow: hidden; color: #fff; background: radial-gradient(90% 80% at 50% 25%, #3a7be0 0%, #1f5fc4 45%, #0e3b8c 100%); box-shadow: 0 10px 30px rgba(14, 59, 140, .35); }
.v-show::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 2px solid rgba(255,255,255,.18); }
.v-stage { position: relative; height: 300px; cursor: grab; touch-action: none; }
.v-head { position: absolute; z-index: 2; left: 16px; right: 16px; top: 14px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
.v-head b { font: 800 22px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.v-head small { display: block; font: 600 12px Inter, sans-serif; opacity: .8; margin-top: 2px; }
.v-pills { position: absolute; z-index: 2; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.v-pills span { padding: 5px 10px; border-radius: 999px; background: rgba(5, 20, 50, .45); font: 600 12px Inter, sans-serif; backdrop-filter: blur(4px); }
.v-btn { pointer-events: auto; border: 0; border-radius: 999px; padding: 7px 12px; background: #fff; color: #0e3b8c; font: 800 13px Inter, sans-serif; cursor: pointer; }
.v-mini-rank { display: flex; gap: 8px; margin-top: 10px; }
.v-mini-rank div { flex: 1; padding: 8px 10px; border-radius: 14px; background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.v-mini-rank b { font: 800 22px var(--display); } .v-mini-rank small { display: block; font: 600 11px Inter, sans-serif; color: var(--muted); }
.v-swipe { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.v-swipe::-webkit-scrollbar { display: none; }
.v-slide { flex: 0 0 100%; scroll-snap-align: start; position: relative; }
.v-dots { position: absolute; z-index: 3; left: 0; right: 0; bottom: 50px; display: flex; justify-content: center; gap: 6px; }
.v-dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.4); } .v-dots i.on { background: #fff; width: 18px; border-radius: 4px; }
.v4-grid { display: grid; grid-template-columns: 1.1fr 1fr; }
.v4-grid .v-stage { height: 280px; }
.v4-grid .v-stage + .v-stage { border-left: 2px solid rgba(255,255,255,.18); }
.v4-img { display: grid; place-items: center; height: 280px; }
.v4-img img { width: 100%; height: 100%; object-fit: contain; }
.v-emotes { position: absolute; z-index: 3; right: 10px; top: 54px; display: grid; gap: 6px; }
.v-emotes button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); font-size: 18px; cursor: pointer; }
</style></head>
<body>
<div class="dm-tabs" id="tabs"></div>
<div class="dm-wrap"><div id="note" class="dm-note"></div><div id="v"></div><div class="dm-ghost" id="rest"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import { mountViewer, racketShot } from './js/shop3d.js';
import { mountAvatar } from './js/player3d.js';

// пример игрока: ракетка и форма из магазина
const LO = { blade: 'jp-b5:FL', fh: 'cn-r5:red', bh: 'eu-r5:black', grip: 'acc-g2:black', tape: 'acc-t3:gold', shirt: 'wr-t7:red', shorts: 'wr-s5:red', shoes: 'wr-f5:wr', head: 'wr-h1:red', wrist: 'wr-w2:red' };
const RK = { blade: LO.blade, fh: LO.fh, bh: LO.bh, grip: LO.grip, tape: LO.tape };
const RK_NAME = 'Tsubame Zenith ZC', RUB = 'Dragon Spin Neo · Rakete MX';
const nickBlock = (rank = true) => `<div class="hero-top">
    <div class="ava lg" style="background:#e63946">🔥</div>
    <div class="hero-id"><div class="hello">Привет,</div><div class="hero-nick">Рустам</div><div class="badges"><span class="badge">🥈 Серебро</span></div></div>
    ${rank ? '<div class="hero-rank"><small>место</small><b>3</b><small>из 14</small></div>' : ''}
  </div>`;
const heroRest = `<div class="hero-mid"><div><div class="big-num">51.0</div><div class="muted small">рейтинг · <span class="up">+2.4</span> за 30 дней</div></div></div>
  <div class="hero-stats"><div><b>23</b><small>побед</small></div><div><b>11</b><small>поражений</small></div><div><b>68</b><small>% побед</small></div><div><b>🔥3</b><small>серия</small></div></div>`;
const showHead = (title, sub, btn) => `<div class="v-head"><div><b>${title}</b><small>${sub}</small></div>${btn ? `<a class="v-btn" href="#">${btn}</a>` : ''}</div>`;

const V = [
  { name: '★ Ваш вариант', note: '<b>Ваш вариант</b>Шапка как сейчас, справа — ракетка в белой рамке: сама медленно крутится, пальцем можно покрутить, из рамки не вылезает. Нажатие — переход в «Мою ракетку». «Место» — плашкой под ником. Ниже «Мой игрок» на половину ширины: синий фон, белая рамка, игрок по грудь смотрит в камеру, сам не крутится. Нажатие — карточка игрока.  Рядом — пинг-коины и переход в магазин. В рамках — белый фон.',
    html: `<section class="hero table-card"><div class="my-top"><div>${nickBlock(false)}<div class="v1-place">3 <small>место из 14</small></div></div><div class="my-frame" id="rk"></div></div>${heroRest}</section>
      <div class="my-row"><a class="my-card" href="#" onclick="return false"><h4>Мой игрок</h4><div class="my-frame" id="pl"></div></a>
        <a class="my-card my-side" href="#" onclick="return false"><span style="font-size:30px">🛍️</span><div><b>1 240</b><small>пинг-коинов</small></div><span class="btn sm primary" style="text-align:center">Магазин →</span></a></div>`,
    mount: async () => { mountViewer(document.getElementById('rk'), RK, { fit: true }); await mountAvatar(document.getElementById('pl'), { gender: 'boy', loadout: LO, bust: true }); } },
  { name: '1. Ракетка в шапке', note: '<b>Вариант 1 — ракетка прямо в синей шапке</b>Вместо блока «место 3 из 14» справа крутится ваша ракетка. Место — маленькой плашкой под ником. Главная почти не меняется, ракетку видно сразу.',
    html: `<section class="hero table-card"><div class="v1-top"><div>${nickBlock(false)}<div class="v1-place">3 <small>место из 14</small></div></div><div class="v1-rk" id="rk"><div class="v-cap">покрутите ↻</div></div></div>${heroRest}</section>`,
    mount: () => mountViewer(document.getElementById('rk'), RK, { zoom: .78 }) },
  { name: '2. Витрина ракетки', note: '<b>Вариант 2 — большая витрина ракетки под шапкой</b>Шапка с рейтингом как сейчас, но «место» убрано в строку под ней. Ниже — крупная синяя витрина: ракетку можно крутить пальцем, видно основание и накладки, кнопка «Собрать».',
    html: `<section class="hero table-card">${nickBlock(false)}${heroRest}</section>
      <div class="v-mini-rank"><div><b>3</b><small>место из 14</small></div><div><b>Серебро</b><small>до Золота 4.0</small></div></div>
      <div class="v-show"><div class="v-stage" id="rk">${showHead('Моя ракетка', RK_NAME, 'Собрать →')}<div class="v-pills"><span>🔴 ${RUB.split(' · ')[0]}</span><span>⚫ ${RUB.split(' · ')[1]}</span><span>🟨 лента Carbon</span></div></div></div>`,
    mount: () => mountViewer(document.getElementById('rk'), RK, { zoom: .62 }) },
  { name: '3. Мой игрок', note: '<b>Вариант 3 — 3D-игрок на главной</b>Под шапкой — синяя сцена с вашим игроком: в вашей форме и с вашей ракеткой в руке. Справа кнопки жестов (победа, удар, привет). Нажатие на сцену — переход в «Мой игрок».',
    html: `<section class="hero table-card">${nickBlock()}${heroRest}</section>
      <div class="v-show"><div class="v-stage" id="pl" style="height:340px">${showHead('Мой игрок', 'форма и ракетка из магазина', 'Изменить →')}<div class="v-emotes"><button data-p="win">🏆</button><button data-p="swing">🏓</button><button data-p="wave">👋</button></div></div></div>`,
    mount: async () => { const c = await mountAvatar(document.getElementById('pl'), { gender: 'boy', loadout: LO }); document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => c.play(b.dataset.p)); } },
  { name: '4. Игрок + ракетка', note: '<b>Вариант 4 — игрок и ракетка рядом</b>Одна синяя витрина на две половины, как стол: слева ваш 3D-игрок, справа ракетка крупным планом. Всё самое ценное — в одном блоке, «место» маленькой плашкой.',
    html: `<section class="hero table-card"><div class="v1-top" style="grid-template-columns:1fr auto">${nickBlock(false)}<div class="v1-place" style="margin:0">3 <small>из 14</small></div></div>${heroRest}</section>
      <div class="v-show"><div class="v4-grid"><div class="v-stage" id="pl"></div><div class="v4-img" id="rkimg"></div></div>${showHead('Мой комплект', RK_NAME, '')}<div class="v-pills"><span>🔥 Рустам</span><span>🏓 ${RK_NAME}</span></div></div>`,
    mount: async () => { await mountAvatar(document.getElementById('pl'), { gender: 'boy', loadout: LO }); const u = racketShot(RK); if (u) document.getElementById('rkimg').innerHTML = `<img src="${u}" alt="">`; } },
  { name: '5. Листалка', note: '<b>Вариант 5 — листалка: ракетка ⇄ игрок</b>Одна витрина под шапкой, внутри два «слайда»: листаете пальцем — ракетка или игрок. Места занимает как один блок, а показывает оба.',
    html: `<section class="hero table-card">${nickBlock()}${heroRest}</section>
      <div class="v-show"><div class="v-swipe" id="sw"><div class="v-slide"><div class="v-stage" id="rk">${showHead('Моя ракетка', RK_NAME, 'Собрать →')}</div></div><div class="v-slide"><div class="v4-img" id="plimg" style="height:300px"></div>${showHead('Мой игрок', 'листните назад к ракетке', 'Изменить →')}</div></div><div class="v-dots"><i class="on"></i><i></i></div></div>`,
    mount: async () => {
      mountViewer(document.getElementById('rk'), RK, { zoom: .62 });
      // игрок — снимком (на одном экране живым может быть только один 3D-вид)
      const tmp = document.createElement('div'); tmp.style.cssText = 'position:absolute;left:-9999px;width:360px;height:300px'; document.body.appendChild(tmp);
      await mountAvatar(tmp, { gender: 'boy', loadout: LO }); await new Promise(r => setTimeout(r, 900));
      const cv = tmp.querySelector('canvas'); if (cv) document.getElementById('plimg').innerHTML = `<img src="${cv.toDataURL()}" alt="">`; tmp.remove();
      const sw = document.getElementById('sw'), dots = document.querySelectorAll('.v-dots i');
      sw.onscroll = () => { const i = Math.round(sw.scrollLeft / sw.clientWidth); dots.forEach((d, k) => d.classList.toggle('on', k === i)); };
    } },
];
const tabs = document.getElementById('tabs');
tabs.innerHTML = V.map((v, i) => `<button data-i="${i}">${v.name}</button>`).join('');
document.getElementById('rest').innerHTML = `<div class="card" style="margin-top:12px"><b>🔥 Бонус дня: +40 PC</b></div><div class="card" style="margin-top:12px"><b>Вызовы</b><p class="muted small">…остальная главная без изменений</p></div>`;
async function show(i) {
  tabs.querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k === i));
  document.getElementById('note').innerHTML = V[i].note;
  document.getElementById('v').innerHTML = V[i].html;
  try { await V[i].mount(); } catch (e) { console.error(e); }
}
tabs.onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); };
show(0);
</script></body></html>

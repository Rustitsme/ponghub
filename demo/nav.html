<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>Нижнее меню PongHub — макет</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Макет: «Матчи» уходят из нижнего меню в профиль, на их место — красный плюс по центру меню. */
:root { --d: "Barlow Condensed", sans-serif; --f: Inter, system-ui, sans-serif; --red: #e63946; --black: #1b1c20; --muted: #6b7a90; --wood: #c98a4b; }
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--f); background: #e9eef6; color: #10203d; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
.note { padding: 12px 14px; border-radius: 14px; background: #fff7d6; color: #4a3a00; font: 500 14px/1.45 var(--f); margin-bottom: 16px; }
.note b { display: block; font-size: 16px; margin-bottom: 3px; }
.row { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
.cap { text-align: center; font: 800 15px var(--f); margin: 0 0 8px; } .cap.bad { color: #a12a33; } .cap.good { color: #157a4b; }
.ph { width: 340px; border-radius: 36px; padding: 12px; background: #10203d; box-shadow: 0 20px 40px rgba(16,32,61,.3); }
.scr { position: relative; height: 680px; border-radius: 26px; overflow: hidden; background: #f3f6fb; }
.page { padding: 14px 14px 100px; }
/* верх главной (упрощённо) */
.hero { border-radius: 22px; padding: 14px; color: #fff; background: linear-gradient(160deg, #3b7fd4, #2563b8 45%, #1c4f9c); display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
.hero b { font: 800 22px var(--d); } .hero .big { font: 800 40px/1 var(--d); margin-top: 8px; } .hero small { opacity: .8; font-size: 12px; }
.rk { border-radius: 14px; background: #fff; box-shadow: 0 0 0 3px #0e3b8c, 0 0 0 5px rgba(255,210,63,.9); display: grid; place-items: center; font-size: 42px; }
.tiles { display: grid; grid-template-columns: 1.55fr 1fr; gap: 10px; margin-top: 12px; }
.pl { border-radius: 20px; padding: 5px; background: #1f5fc4; } .pl div { height: 186px; border-radius: 16px; background: radial-gradient(90% 75% at 50% 35%, #f3f5f9, #cfd7e3); display: grid; place-items: center; font-size: 64px; }
.col { display: grid; gap: 10px; } .t { border-radius: 18px; padding: 10px; text-align: center; background: #fff; border: 4px solid #1f5fc4; }
.t small { display: block; font: 700 10px var(--f); color: var(--muted); text-transform: uppercase; } .t b { font: 800 24px var(--d); color: #1f5fc4; }
.t span { display: inline-block; margin-top: 4px; padding: 5px 10px; border-radius: 99px; background: var(--red); color: #fff; font: 800 11px var(--f); }
.t.bonus { background: linear-gradient(135deg, #ff8a3d, #e63946); border-color: #fff; color: #fff; } .t.bonus small, .t.bonus b { color: #fff; } .t.bonus span { background: #fff; color: var(--red); }
/* нижнее меню */
.tabs { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 6px 14px; background: rgba(233,238,246,.94); backdrop-filter: blur(10px); border-top: 1px solid #d5dde9; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--muted); font-size: 11px; font-weight: 600; }
.tab svg { width: 24px; height: 24px; } .tab.on { color: #10203d; } .tab.on svg { color: var(--red); } .tab.on span { box-shadow: 0 2px 0 var(--wood); }
.fab { position: absolute; right: 16px; bottom: 82px; width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--black); background: var(--red); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 22px rgba(230,57,70,.45); }
.fab svg { width: 28px; height: 28px; stroke-width: 2.6; }
/* стало: плюс — центральная кнопка меню, чуть приподнят */
.tab.mid { position: relative; } .tab.mid .fab { position: static; margin-top: -26px; width: 60px; height: 60px; box-shadow: 0 6px 18px rgba(230,57,70,.45), 0 0 0 5px rgba(233,238,246,.94); }
.tab.mid em { font-style: normal; color: var(--red); font-weight: 800; margin-top: 2px; }
.ring { position: absolute; right: 8px; bottom: 74px; width: 74px; height: 74px; border-radius: 50%; border: 3px dashed #e63946; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.warn { position: absolute; right: 86px; bottom: 96px; padding: 5px 9px; border-radius: 10px; background: #a12a33; color: #fff; font: 700 11px var(--f); }
/* профиль */
.me { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; } .me .ava { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--red); display: grid; place-items: center; font-size: 24px; background: #fde2e4; }
.me b { font: 800 22px var(--d); } .me small { display: block; color: var(--muted); font-size: 12px; }
.mi { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-radius: 14px; background: #fff; margin-bottom: 8px; font: 600 15px var(--f); box-shadow: 0 1px 4px rgba(16,32,61,.05); }
.mi i { margin-left: auto; font-style: normal; color: #9aa6b8; } .mi.new { box-shadow: 0 0 0 2px #f2b600, 0 4px 12px rgba(242,182,0,.25); }
.mi .nb { margin-left: auto; padding: 2px 8px; border-radius: 99px; background: #f2b600; color: #3a2a00; font: 800 10px var(--f); } .mi .nb + i { margin-left: 6px; }
.mi small { display: block; font: 500 12px var(--f); color: var(--muted); }
</style></head>
<body><div class="wrap">
<div class="note"><b>Нижнее меню: плюс по центру, «Матчи» — в профиле</b>Сейчас красный плюс висит над меню справа и закрывает плитку «Бонус дня». Станет: в нижнем меню 4 раздела и плюс ровно по центру, как отдельная большая кнопка — ничего не закрывает. «Матчи» переезжают в «Профиль» первой строкой меню.</div>
<div class="row" id="row"></div></div>
<script>
const I = { home: '<path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>', rating: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  matches: '<path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/>',
  cup: '<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 21h8M9 18h6"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>', plus: '<path d="M12 5v14M5 12h14"/>' };
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const tab = (n, t, on) => `<div class="tab ${on ? 'on' : ''}">${ic(n)}<span>${t}</span></div>`;
const home = `<div class="page"><div class="hero"><div><small>Привет,</small><br><b>Рустам</b><div class="big">38.3</div><small>рейтинг</small></div><div class="rk">🏓</div></div>
  <div class="tiles"><div class="pl"><div>🧍</div></div><div class="col"><div class="t"><small>Пинг-коины</small><b>335 PC</b><br><span>Магазин →</span></div><div class="t bonus"><small>🔥 Бонус дня</small><b>+40 PC</b><br><span>Забрать →</span></div></div></div></div>`;
const before = `<div class="scr">${home}<div class="ring"></div><div class="warn">закрывает «Бонус дня»</div><div class="fab">${ic('plus')}</div>
  <nav class="tabs">${tab('home', 'Главная', 1)}${tab('rating', 'Рейтинг')}${tab('matches', 'Матчи')}${tab('cup', 'Турниры')}${tab('user', 'Профиль')}</nav></div>`;
const mid = `<div class="tab mid"><div class="fab">${ic('plus')}</div><em>Игра</em></div>`;
const after = `<div class="scr">${home}<nav class="tabs">${tab('home', 'Главная', 1)}${tab('rating', 'Рейтинг')}${mid}${tab('cup', 'Турниры')}${tab('user', 'Профиль')}</nav></div>`;
const prof = `<div class="scr"><div class="page"><div class="me"><div class="ava">🔥</div><div><b>Рустам</b><small>Коворкинг «IT Park» KZN · Владелец</small></div></div>
  <div class="mi new">📋 <div>Матчи<small>все игры клуба, ваши результаты, личные встречи</small></div><span class="nb">НОВОЕ МЕСТО</span><i>›</i></div>
  <div class="mi">🧍 Мой игрок<i>›</i></div><div class="mi">🏓 Моя ракетка<i>›</i></div><div class="mi">🛍️ Магазин<i>›</i></div><div class="mi">🎯 Прогнозы<i>›</i></div><div class="mi">📅 Календарь<i>›</i></div><div class="mi">🛠️ Управление клубом<i>›</i></div><div class="mi">❓ Помощь<i>›</i></div></div>
  <nav class="tabs">${tab('home', 'Главная')}${tab('rating', 'Рейтинг')}${mid}${tab('cup', 'Турниры')}${tab('user', 'Профиль', 1)}</nav></div>`;
document.getElementById('row').innerHTML = [['Было', 'bad', before], ['Станет: главная', 'good', after], ['Станет: профиль', 'good', prof]].map(([c, k, h]) => `<div><p class="cap ${k}">${c}</p><div class="ph">${h}</div></div>`).join('');
</script></body></html>

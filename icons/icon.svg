<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4f8f"/>
      <stop offset="1" stop-color="#0a1f3c"/>
    </linearGradient>
    <linearGradient id="rub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d5a"/>
      <stop offset="1" stop-color="#b5121f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2a467"/>
      <stop offset="1" stop-color="#a8652d"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f1f3f7"/>
      <stop offset="1" stop-color="#c9d1de"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- разметка стола -->
  <rect x="44" y="44" width="424" height="424" rx="72" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="10"/>
  <line x1="256" y1="44" x2="256" y2="468" stroke="#fff" stroke-opacity=".35" stroke-width="6"/>
  <!-- ракетка -->
  <g transform="rotate(-38 236 276)">
    <rect x="212" y="318" width="48" height="128" rx="16" fill="url(#wood)"/>
    <rect x="212" y="318" width="48" height="26" fill="#7a4520" opacity=".55"/>
    <ellipse cx="236" cy="212" rx="112" ry="124" fill="#111318"/>
    <ellipse cx="236" cy="206" rx="104" ry="116" fill="url(#rub)"/>
    <ellipse cx="206" cy="166" rx="40" ry="26" fill="#fff" opacity=".14" transform="rotate(-30 206 166)"/>
  </g>
  <!-- мяч -->
  <path d="M300 128 Q350 108 392 118" stroke="#fff" stroke-opacity=".45" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M310 158 Q352 146 384 152" stroke="#fff" stroke-opacity=".3" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="396" cy="128" r="44" fill="url(#ball)"/>

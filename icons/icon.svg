<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#7cc9ff"/>
      <stop offset="0.6" stop-color="#3a9cec"/>
      <stop offset="1" stop-color="#1f74cc"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a66"/>
      <stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
    <linearGradient id="blk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0bd84"/>
      <stop offset="0.5" stop-color="#d4924f"/>
      <stop offset="1" stop-color="#a5622a"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.35" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f07b12"/>
    </radialGradient>
    <g id="handle">
      <rect x="-20" y="-34" width="40" height="128" rx="14" fill="url(#wood)"/>
      <rect x="-20" y="-34" width="40" height="22" rx="6" fill="#8a4f1f" opacity=".45"/>
      <path d="M-8 -6 V84 M6 -6 V84" stroke="#8a4f1f" stroke-opacity=".25" stroke-width="3"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- линия сетки/стола -->
  <path d="M40 404 H472" stroke="#fff" stroke-opacity=".55" stroke-width="8" stroke-linecap="round"/>
  <!-- чёрная ракетка -->
  <g transform="translate(256 336) rotate(40)">
    <use href="#handle"/>
    <ellipse cx="0" cy="-118" rx="84" ry="92" fill="#0b0d12"/>
    <ellipse cx="0" cy="-122" rx="78" ry="86" fill="url(#blk)"/>
    <ellipse cx="-24" cy="-150" rx="26" ry="16" fill="#fff" opacity=".12" transform="rotate(-25 -24 -150)"/>
  </g>
  <!-- красная ракетка -->
  <g transform="translate(256 336) rotate(-40)">
    <use href="#handle"/>
    <ellipse cx="0" cy="-118" rx="84" ry="92" fill="#7a0a17"/>
    <ellipse cx="0" cy="-122" rx="78" ry="86" fill="url(#red)"/>
    <ellipse cx="-24" cy="-152" rx="28" ry="17" fill="#fff" opacity=".22" transform="rotate(-25 -24 -152)"/>
  </g>
  <!-- мяч с закруткой -->
  <path d="M168 92 Q210 52 256 60" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" opacity=".85"/>
  <path d="M150 128 Q186 100 222 96" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".55"/>
  <circle cx="290" cy="88" r="40" fill="url(#ball)"/>
  <path d="M262 74 Q290 100 318 74" stroke="#fff" stroke-opacity=".6" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
